    - source: https://raw.githubusercontent.com/fullsend-ai/agents/2c3e23f474b9dcac3e8837d32fba3bf08cec0236/harness/retro.yaml#sha256=907c0ce9c4da6ebfd4d3be7297afd0050026494f6d1d8c135e6bd5671f49a7c2
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/0a1318292d072bced4c6fe5170cb01eae0d83099/harness/scribe.yaml#sha256=988dc1b90889abda5cf9cca06059bcdd0df6ca32e860318a8a433f698b9d9004
