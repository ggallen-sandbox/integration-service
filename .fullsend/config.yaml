# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/e34d125b00948385bc9c66366bb5b65b9df5c707/harness/prioritize.yaml#sha256=026fdd71a4779cbf2155f27f1846065fa20add11e42493013beabbc32cbcea6a
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/8ad41b385a9fba9a74eef173136b5a0b7b06c58b/harness/fix.yaml#sha256=e0ea3143f926f349f67adde9db3a215b81be3e90199fe03c747df05472a78a99
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/ab5f286ee213318be28f07df38a6f8f7237b662a/harness/retro.yaml#sha256=a31c2a815ae1d0cc22990c31913e78efe14ce4b81acf31c5d8d3ce81b0db0831
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - ggallen-sandbox/integration-service
            - fullsend-ai/fullsend
