# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See ADR 0033 for details.
version: "1"
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/253f38201c391dce656dd0508f4512184880aa4b/harness/triage.yaml#sha256=ca36c3b6f7cd2b722aa1c799f3c0d7b06b32c3b0bcc56641bd86c2fdcc8c0624
    - source: https://raw.githubusercontent.com/fullsend-ai/agents/253f38201c391dce656dd0508f4512184880aa4b/harness/code.yaml#sha256=c0af44e13d46399f856d89a2d3080261e1be076bf010da1af37882da54421db8
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - ggallen-sandbox/integration-service
            - fullsend-ai/fullsend
